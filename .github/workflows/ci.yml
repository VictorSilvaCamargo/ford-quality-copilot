name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

  test:
    name: Smoke Tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: ci_quality_user
          POSTGRES_PASSWORD: ci_quality_test_password
          POSTGRES_DB: quality_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_quality_user -d quality_copilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci_quality_user
      POSTGRES_PASSWORD: ci_quality_test_password
      POSTGRES_DB: quality_copilot_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Execute SQL initialization script
        run: |
          uv run python -c "
          from pathlib import Path
          import os, psycopg
          conninfo = (
              f\"host={os.environ['POSTGRES_HOST']} \"
              f\"port={os.environ['POSTGRES_PORT']} \"
              f\"dbname={os.environ['POSTGRES_DB']} \"
              f\"user={os.environ['POSTGRES_USER']} \"
              f\"password={os.environ['POSTGRES_PASSWORD']}\"
          )
          sql = Path('docker/init/01_pgvector.sql').read_text(encoding='utf-8')
          with psycopg.connect(conninfo, autocommit=True) as conn:
              conn.execute(sql)
          "

      - name: Run pytest
        run: uv run pytest -v
